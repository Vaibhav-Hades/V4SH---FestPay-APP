<script>
  (function () {
    const laser = document.getElementById('scan-laser');
    let direction = 1;
    let pos = 24;
    const minPos = 20;
    const maxPos = 236;

    function step() {
      pos += direction * 1.8;
      if (pos >= maxPos) {
        direction = -1;
      } else if (pos <= minPos) {
        direction = 1;
      }
      if (laser) {
        laser.style.top = pos + 'px';
      }
      requestAnimationFrame(step);
    }
    requestAnimationFrame(step);

    const torchBtn = document.getElementById('torch-btn');
    const torchIconContainer = document.getElementById('torch-icon-container');
    const torchIcon = document.getElementById('torch-icon');
    let isTorchActive = false;

    if (torchBtn && torchIconContainer && torchIcon) {
      torchBtn.addEventListener('click', function () {
        isTorchActive = !isTorchActive;
        if (isTorchActive) {
          torchIconContainer.classList.remove('bg-surface-container-lowest', 'text-primary-container');
          torchIconContainer.classList.add('bg-primary-container', 'text-on-primary');
          torchIcon.style.fontVariationSettings = "'FILL' 1";
        } else {
          torchIconContainer.classList.remove('bg-primary-container', 'text-on-primary');
          torchIconContainer.classList.add('bg-surface-container-lowest', 'text-primary-container');
          torchIcon.style.fontVariationSettings = "'FILL' 0";
        }
      });
    }
  })();
