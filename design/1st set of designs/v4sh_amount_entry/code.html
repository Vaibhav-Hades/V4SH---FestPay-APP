<body class="min-h-screen flex justify-center items-start bg-[#FFF8F0] p-0 m-0 selection:bg-brand selection:text-white">
<!-- Mobile Container (Android target ~390-412px width) -->
<main class="w-full max-w-md min-h-screen bg-[#FFF8F0] flex flex-col justify-between px-6 py-5 relative"><div class="flex flex-col w-full">
<!-- Top Navigation Sub-bar -->
<div class="flex items-center justify-between py-space-sm mb-space-md"><div class="flex items-center gap-2"><button aria-label="Go back to QR recipient" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-low text-on-surface hover:bg-surface-container transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">arrow_back</span></button><img alt="V" class="h-6 w-6 object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1UwiG0taX7NhIY64AYFlNsukb_UB7oQgma-AwtjGShs-xkQgYJJNHNvPM-Pj6OibjmvctyGFeGpb2JJL-B_KGvIfU6uLPXl_Vf26cZ3lmN5WyGvQqd5a-P62LNEp85mU2w-XdaoLFFNxLGVNUztWErrjllgHNV7ciwtNzBnnk6ysZHKVTmFaa--j70OwKMXt89ABC8-6dsRHrI013asYbeSdSNYR5zdvHTHl63JzdvtidyBzqmDByqucA"/></div><button aria-label="Help and assistance" class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-low text-on-surface hover:bg-surface-container transition-colors" type="button"><span class="material-symbols-outlined text-[20px]">help_outline</span></button></div>
<!-- Main Interaction Stack -->
<div class="flex flex-col gap-space-lg">
<!-- Compact Recipient Card -->
<section class="bg-surface-container-lowest rounded-xl p-space-md shadow-sm">
<div class="flex items-center gap-3">
<!-- Monogram Avatar -->
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-fixed flex items-center justify-center font-label-lg text-label-lg shrink-0">
          AS
        </div>
<!-- Payee Text Information -->
<div class="flex flex-col min-w-0 flex-1">
<div class="flex items-center justify-between gap-1">
<h2 class="font-headline-sm text-headline-sm text-on-surface truncate">Aarav Sharma</h2>
<span class="px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm uppercase tracking-wider shrink-0">
              Standard UPI
            </span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant font-mono mt-0.5">aarav@upi</p>
</div>
</div>
<!-- Scanned QR Origin Verification -->
<div class="mt-3 pt-2.5 flex items-center gap-1.5 text-on-surface-variant bg-surface-container-low rounded-lg px-2.5 py-1.5">
<span class="material-symbols-outlined text-[15px] text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-sm text-body-sm">Recipient verified from scanned UPI QR</span>
</div>
</section>
<!-- Visual Amount Stage -->
<section class="flex flex-col items-center text-center pt-space-xs">
<h1 class="font-headline-lg text-headline-lg text-on-surface font-serif">Enter amount</h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1">How much would you like to pay?</p>
<!-- Editorial Centered Amount Canvas -->
<div class="mt-6 mb-2 flex items-baseline justify-center gap-1.5">
<span class="font-headline-md text-headline-md text-secondary select-none font-serif">₹</span>
<span class="font-display-lg text-display-lg text-primary-container font-serif tracking-tight" id="amount-display">500</span>
<span class="w-0.5 h-8 bg-primary-container animate-pulse rounded-full ml-0.5"></span>
</div>
<!-- Quick Preset Chips -->
<div class="flex items-center justify-center gap-2 mt-4 flex-wrap">
<button class="chip-preset px-3.5 py-1.5 rounded-full font-label-md text-label-md bg-surface-container-low text-on-surface transition-all active:scale-95" onclick="setPreset('100', this)" type="button">
          ₹100
        </button>
<button class="chip-preset px-3.5 py-1.5 rounded-full font-label-md text-label-md bg-surface-container-low text-on-surface transition-all active:scale-95" onclick="setPreset('200', this)" type="button">
          ₹200
        </button>
<button class="chip-preset px-3.5 py-1.5 rounded-full font-label-md text-label-md bg-primary-container text-on-primary transition-all active:scale-95" onclick="setPreset('500', this)" type="button">
          ₹500
        </button>
<button class="chip-preset px-3.5 py-1.5 rounded-full font-label-md text-label-md bg-surface-container-low text-on-surface transition-all active:scale-95" onclick="setPreset('1000', this)" type="button">
          ₹1,000
        </button>
</div>
</section>
<!-- Optional Note Field -->
<section class="flex flex-col gap-1.5 mt-2">
<label class="font-label-md text-label-md text-on-surface-variant" for="payment-note">Add a note (optional)</label>
<div class="flex items-center gap-2.5 bg-surface-container-lowest px-3.5 py-3 rounded-lg shadow-sm">
<span class="material-symbols-outlined text-secondary text-[20px]">edit_note</span>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none" id="payment-note" maxlength="60" placeholder="What's this payment for?" type="text"/>
</div>
</section>
</div>
<!-- Bottom Fixed Navigation Panel -->
<div class="mt-8 flex flex-col gap-3 pt-4">

<span class="">Continue to Review</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Secondary Navigation -->
<button class="w-full py-2.5 text-center font-label-md text-label-md text-secondary hover:text-on-surface transition-colors" type="button">
      Cancel
    </button>

<p class="font-body-sm text-body-sm text-on-surface-variant text-center pb-2">
      Payment will be initiated only after you review the details.
    </p>
</div>
</div>
<script>
  function setPreset(val, el) {
    const display = document.getElementById('amount-display');
    if (!display) return;
    
    // Format display string with commas if needed
    const formatted = parseInt(val, 10).toLocaleString('en-IN');
    display.textContent = formatted;

    // Toggle active chip styling
    const allChips = document.querySelectorAll('.chip-preset');
    allChips.forEach(chip => {
      chip.classList.remove('bg-primary-container', 'text-on-primary');
      chip.classList.add('bg-surface-container-low', 'text-on-surface');
    });

    el.classList.remove('bg-surface-container-low', 'text-on-surface');
    el.classList.add('bg-primary-container', 'text-on-primary');
  }
</script></main>
